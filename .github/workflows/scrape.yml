name: Scrape raadsdata
on:
  workflow_dispatch:
    inputs:
      vanaf:
        description: 'Ophalen vanaf datum (YYYY-MM-DD) — leeg = automatisch sinds laatste scrape'
        required: false
        default: ''
concurrency:
  group: scrape-raadsdata
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies installeren
        run: pip install pypdf --break-system-packages
      - name: Data-map aanmaken
        run: mkdir -p data
      - name: Startdatum bepalen (sinds laatste scrape)
        if: ${{ github.event.inputs.vanaf == '' }}
        run: |
          if [ -f data/.last_scrape_raadsdata ]; then
            SCRAPE_VANAF=$(cat data/.last_scrape_raadsdata)
            echo "Vorige scrape-tracker gevonden: vanaf $SCRAPE_VANAF"
          else
            SCRAPE_VANAF=$(date -u -d '8 hours ago' +'%Y-%m-%d')
            echo "Geen tracker gevonden (eerste run) — val terug op 8 uur terug: $SCRAPE_VANAF"
          fi
          echo "SCRAPE_VANAF=$SCRAPE_VANAF" >> $GITHUB_ENV
        shell: bash
      - name: Moties scrapen
        id: moties
        run: python scrape_moties.py
        env:
          SCRAPE_VANAF: ${{ env.SCRAPE_VANAF || github.event.inputs.vanaf }}
        continue-on-error: true
      - name: Vergaderingen scrapen
        id: vergaderingen
        run: python scrape_vergaderingen.py
        env:
          SCRAPE_VANAF: ${{ env.SCRAPE_VANAF || github.event.inputs.vanaf }}
        continue-on-error: true
      - name: Stemmingen scrapen
        id: stemmingen
        run: python scrape_stemmingen.py
        env:
          SCRAPE_VANAF: ${{ env.SCRAPE_VANAF || github.event.inputs.vanaf }}
        continue-on-error: true
      - name: Collegeberichten scrapen
        id: collegeberichten
        run: python scrape_collegeberichten.py
        env:
          SCRAPE_VANAF: ${{ env.SCRAPE_VANAF || github.event.inputs.vanaf }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        continue-on-error: true
      - name: Camera's en woningsluitingen scrapen
        id: besluiten
        run: python scrape_besluiten.py
        env:
          SCRAPE_VANAF: ""
        continue-on-error: true
      - name: Scrape-tracker bijwerken
        # LET OP: alleen bijwerken als geen enkele scraper is gefaald.
        # Anders schuift de "sinds laatste scrape"-datum stilzwijgend op
        # over een venster dat nooit succesvol is opgehaald.
        if: |
          steps.moties.outcome == 'success' &&
          steps.vergaderingen.outcome == 'success' &&
          steps.stemmingen.outcome == 'success' &&
          steps.collegeberichten.outcome == 'success' &&
          steps.besluiten.outcome == 'success'
        run: date -u +'%Y-%m-%d' > data/.last_scrape_raadsdata
      - name: Waarschuwen bij gefaalde scraper
        if: |
          steps.moties.outcome == 'failure' ||
          steps.vergaderingen.outcome == 'failure' ||
          steps.stemmingen.outcome == 'failure' ||
          steps.collegeberichten.outcome == 'failure' ||
          steps.besluiten.outcome == 'failure'
        run: |
          echo "::warning::Eén of meer scrapers zijn gefaald — scrape-tracker NIET bijgewerkt, zodat het gemiste venster bij de volgende run opnieuw wordt geprobeerd."
      - name: Wijzigingen committen en pushen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Geen wijzigingen om te committen, overslaan."
            exit 0
          fi
          git commit -m "data: update $(date +'%Y-%m-%d')${SCRAPE_VANAF:+ (vanaf $SCRAPE_VANAF)}"
          MAX_POGINGEN=5
          WACHTTIJDEN=(3 6 12 20 30)
          for ((poging=1; poging<=MAX_POGINGEN; poging++)); do
            if git push; then
              echo "Push gelukt (poging $poging)"
              break
            fi
            if [ "$poging" -eq "$MAX_POGINGEN" ]; then
              echo "Push definitief mislukt na $MAX_POGINGEN pogingen"
              exit 1
            fi
            wacht=${WACHTTIJDEN[$((poging-1))]}
            echo "Push mislukt (poging $poging/$MAX_POGINGEN) — ${wacht}s wachten en opnieuw pullen/rebasen"
            sleep "$wacht"
            git pull --rebase --autostash
          done
        env:
          SCRAPE_VANAF: ${{ env.SCRAPE_VANAF || github.event.inputs.vanaf }}
      - name: Deploy triggeren
        if: success()
        run: gh workflow run static.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
